# 南向适配器配置 - 数据源
southbound:
  adapters:
    # Mock适配器 - 用于测试
    - name: "mock_temperature_sensors"
      type: "mock"
      enabled: true
      config:
        name: "mock_temperature_sensors"
        type: "mock"
        enabled: true
        description: "温湿度传感器模拟器"
        interval: "1s"
        data_points:
          - device_id: "temp_sensor_01"
            key: "temperature"
            min_value: 15.0
            max_value: 45.0
            unit: "celsius"
          - device_id: "temp_sensor_01"
            key: "humidity"
            min_value: 30.0
            max_value: 90.0
            unit: "percent"
    
    # Mock适配器 - 压力传感器
    - name: "mock_pressure_sensors"
      type: "mock"
      enabled: true
      config:
        name: "mock_pressure_sensors"
        type: "mock"
        enabled: true
        description: "压力高度传感器模拟器"
        interval: "2s"
        data_points:
          - device_id: "pressure_sensor_01"
            key: "pressure"
            min_value: 900.0
            max_value: 1100.0
            unit: "hPa"
          - device_id: "pressure_sensor_01"
            key: "altitude"
            min_value: 0.0
            max_value: 2000.0
            unit: "meters"
    
    # Mock适配器 - 高频数据流（用于性能测试）
    - name: "mock_high_frequency"
      type: "mock"
      enabled: true
      config:
        name: "mock_high_frequency"
        type: "mock"
        enabled: true
        description: "高频振动传感器模拟器"
        interval: "100ms"
        data_points:
          - device_id: "vibration_sensor_01"
            key: "vibration"
            min_value: 0.0
            max_value: 10.0
            unit: "m/s2"
          - device_id: "vibration_sensor_01"
            key: "rotation_speed"
            min_value: 1000.0
            max_value: 5000.0
            unit: "rpm"

    # 复合数据模拟器 - 综合复合数据类型测试
    - name: "composite_mock_sensors"
      type: "composite_mock"
      enabled: true
      config:
        name: "composite_mock_sensors"
        type: "composite_mock"
        enabled: true
        description: "复合数据类型综合测试模拟器"
        interval: "3s"
        tags:
          environment: "test"
          data_source: "composite_mock"
        composite_data_types:
          # GPS位置数据
          - device_id: "gps_tracker_01"
            key: "location"
            data_type: "location"
            location_config:
              start_latitude: 39.9042
              start_longitude: 116.4074
              latitude_range: 0.01
              longitude_range: 0.01
              altitude_min: 40.0
              altitude_max: 50.0
              speed_min: 0.0
              speed_max: 60.0
              simulate_movement: true
              movement_pattern: "random_walk"
          
          # 3D向量数据（加速度计）
          - device_id: "accelerometer_01"
            key: "acceleration"
            data_type: "vector3d"
            vector3d_config:
              x_min: -10.0
              x_max: 10.0
              y_min: -10.0
              y_max: 10.0
              z_min: -10.0
              z_max: 10.0
              correlation: 0.3
              oscillation: true
              frequency: 2.0
          
          # 颜色数据（RGB传感器）
          - device_id: "rgb_sensor_01"
            key: "color_reading"
            data_type: "color"
            color_config:
              color_mode: "rainbow"
              brightness_range: [50, 255]
              saturation_range: [80, 100]
              hue_change_speed: 2.0
          
          # 通用向量数据
          - device_id: "vector_sensor_01"
            key: "signal_vector"
            data_type: "vector"
            vector_config:
              dimension: 5
              min_values: [0.0, 10.0, 20.0, 30.0, 40.0]
              max_values: [10.0, 20.0, 30.0, 40.0, 50.0]
              labels: ["ch1", "ch2", "ch3", "ch4", "ch5"]
              global_min: 0.0
              global_max: 50.0
              correlation: 0.2
              distribution: "normal"
              change_pattern: "oscillate"
              unit: "voltage"
          
          # 数组数据
          - device_id: "array_sensor_01"
            key: "measurement_array"
            data_type: "array"
            array_config:
              size: 8
              element_type: "float"
              min_value: 10.0
              max_value: 100.0
              labels: ["temp1", "temp2", "temp3", "temp4", "temp5", "temp6", "temp7", "temp8"]
              change_elements: 3
              unit: "celsius"

# 北向输出配置 - 数据目的地
northbound:
  sinks:
    # 控制台输出 - 用于调试
#    - name: "console_debug"
#      type: "console"
#      enabled: true
#      config:
#        name: "console_debug"
#        type: "console"
#        batch_size: 10
#        buffer_size: 1000
    
#    # 文件输出 - 用于数据分析
#    - name: "file_logger"
#      type: "file"
#      enabled: true
#      config:
#        filename: "./logs/rule_engine_test_data.log"
#        max_size: "100MB"
#        max_files: 10
#        format: "json"
#        include_raw_data: true
    
    # WebSocket输出 - 用于实时监控
    - name: "websocket_monitor"
      type: "websocket"
      enabled: true
      config:
        name: "websocket_monitor"
        type: "websocket"
        batch_size: 10
        buffer_size: 1000
        params:
          address: ":8092"  # 改为8092端口，避免与其他服务冲突
          path: "/ws/rules"
          allow_origins: ["*"]
          subscribe_topics:
            - "iot.rules.>"
          points: {}
    
    # MQTT输出 - 用于外部系统集成
    # 需要断网续传时添加（并开启上面的 storage.enabled）：
    #   # 接收哪些数据（默认只有 iot.data.> 原始数据）；也可以直接订阅规则结果和告警，并按设备、数据键过滤
    #   # 聚合结果 iot.rules.aggregate.>，transform 输出 transformed.>（iot.rules.> 还包含每次匹配的 iot.rules.matched 事件）
    #   subscriptions: ["iot.data.>", "iot.rules.aggregate.>", "transformed.>", {subject: "iot.alerts.>", data_type: alert}]
    #   filter:
    #     devices: ["temp_sensor_*"]
    #     keys: ["temperature", "temperature_f"]
    #   buffer:
    #     enabled: true
    #     batch_size: 500
    #     max_wait: "1s"
    #     start_from: "new"     # new | all
    #     replay_rate: 2000     # 写入目标的最大速率（点/秒），0 不限；窄带链路建议设置，避免补发挤占实时数据
    - name: "mqtt_output"
      type: "mqtt"
      enabled: false  # 默认禁用，需要MQTT broker（可以开启上面的 gateway.mqtt 使用内嵌 MQTT）
      config:
        name: "mqtt_output"
        type: "mqtt"
        batch_size: 10
        buffer_size: 1000
        params:
          broker: "tcp://localhost:1883"
          client_id: "iot_gateway_rules_test"
          topic_tpl: "iot/%s/%s"
          qos: 1
          retained: false

    - name: "rule_output_processor"
      type: "nats_subscriber"
      batch_size: 15
      params:
        buffer_size: 600
        batch_size: 30

        # 订阅规则引擎输出
        subscriptions:
          - subject: "iot.rules.>"
            data_type: "rule"
            enabled: true
            tags:
              source: "rule_engine"
              category: "processed_data"

        # 转发到WebSocket和Redis
        # 目标sink配置
        target_sinks:
          - name: "console_output"
            type: "console"
            params:
              format: "json"


# Web UI配置
web_ui:
  enabled: true
  port: 8081
  # 跨域白名单：同源访问（同域部署或 Vite 代理）不需要配置。
  # 需要从其他域名访问 API 时在这里列出，例如 ["http://192.168.1.10:3000"]
  cors:
    allowed_origins: []
  auth:
    # JWT 签名密钥：请设置为至少 16 位的随机字符串（或使用环境变量注入）。
    # 留空或使用旧的占位值时，网关会自动生成随机密钥并保存在 data/.jwt_secret。
    jwt_secret: ""
    token_duration: "24h"
    refresh_duration: "168h"
    max_login_attempts: 5
    lockout_duration: "15m"
    enable_two_factor: false
    session_timeout: "30m"
    password_min_length: 6
    bcrypt_cost: 10
  
  # WebSocket配置 - 用于实时数据推送
  websocket:
    max_clients: 50        # 最大客户端连接数
    message_rate: 40       # 消息发送速率限制 (每秒) - 适应高频数据
    read_buffer_size: 4096 # 读取缓冲区大小
    write_buffer_size: 4096 # 写入缓冲区大小
    cleanup_interval: 30   # 清理间隔 (秒)
    inactivity_timeout: 300 # 不活跃超时 (秒)
    ping_interval: 54      # Ping间隔 (秒)
    pong_timeout: 60       # Pong超时 (秒)

# 数据库配置（用于存储认证信息）
database:
  sqlite:
    path: "./data/auth.db"

# Rules配置（Web服务使用）
rules:
  dir: "./rules"