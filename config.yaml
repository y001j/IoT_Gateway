# IoT Gateway 规则引擎功能测试配置
# 此配置文件专门用于测试规则引擎的各种功能和性能

# 网关核心配置
gateway:
  name: "IoT Gateway Rule Engine Test"
  version: "1.0.0"
  log_level: "error"
  http_port: 8080             # 运维接口（/health、/metrics）；设为 0 时只由 Web 端口（web_ui.port）提供
  https_port: 8443
  nats_url: "embedded"
  plugins_dir: "./plugins"

  # 内嵌 MQTT：让内嵌 NATS 服务器同时提供 MQTT 3.1.1 服务（只在 nats_url 为 embedded 且网关自己启动了 NATS 时生效）。
  # MQTT 主题与 NATS 主题互通（"/" ↔ "."，"+" ↔ "*"，"#" ↔ ">"）：MQTT 客户端订阅 iot/rules/# 或 iot/alerts/#
  # 就能收到规则引擎结果和告警；mqtt 连接器（mqtt_output）也可以把 broker 指向 tcp://localhost:1883。
  mqtt:
    enabled: false
    host: "127.0.0.1"     # 只允许本机访问；让局域网设备连接时改为 "0.0.0.0"，并配置用户名密码
    port: 1883
    # username: "gateway"
    # password: "请修改"

  # 采集数据管道参数
  pipeline:
    batch_size: 100          # 每批数据点数量
    flush_interval: "50ms"   # 批次未满时的最长等待时间
    channel_size: 10000      # 适配器到管道的缓冲通道大小
    sink_queue_size: 256     # 每个连接器的批次队列长度（满了会丢弃该连接器的批次并计数）
  enable_metrics: true
  enable_profiling: true
  
  # 热加载配置
  hot_reload:
    enabled: true                    # 启用/禁用配置文件热加载
    graceful_fallback: true          # 热加载失败时优雅降级
    retry_interval: "30s"            # 监控器启动失败后重试间隔
    max_retries: 3                   # 最大重试次数

# 本地暂存（断网续传），设计见 docs/design_local_storage.md
# 开启后所有采集数据写入内嵌 JetStream 持久化流；在连接器配置中设置 buffer.enabled: true 的连接器
# 在目标不可用时数据保留在本地磁盘，恢复后按原顺序补发，网关重启后从断点继续。
# 状态查看：GET http://<网关>:8080/storage；Web 界面"历史数据"页可查询近期数据（/api/v1/data/*）
storage:
  enabled: false
  store_dir: "./data/jetstream"
  max_disk: "4GB"            # JetStream 总磁盘上限
  sync_interval: "10s"       # 刷盘间隔：掉电时最多丢失这段时间内的数据
  raw:
    max_age: "24h"           # 最长保留时间
    max_bytes: "2GB"         # 超出后丢弃最旧数据（未补发的数据会计入 lost 并在 /health 中告警）
    compression: "s2"
  rollup:                    # 汇总层：按窗口保存 count/min/max/avg/last，用于查看长期趋势
    enabled: false
    interval: "1m"
    max_age: "720h"          # 30 天
    max_bytes: "1GB"         # 与 raw.max_bytes 之和不能超过 max_disk
  alerts:                    # 积压/磁盘告警，发布到 iot.alerts.triggered（Web 告警和通知渠道会收到）
    enabled: true
    interval: "30s"
    lag_warning_ratio: 0.5   # 积压达到保留上限（max_age 或 max_bytes）的 50% 时 warning
    lag_critical_ratio: 0.8  # 80% 时 critical；达到 100% 开始丢数据
    disk_warning_ratio: 0.8  # 数据目录所在磁盘使用率
    disk_critical_ratio: 0.95
    throttle: "30m"          # 同一告警的重复发送间隔
  query:                     # 近期数据查询的资源限制（保护采集性能）
    max_concurrent: 2        # 同时执行的查询数
    max_scan: 200000         # 单次查询最多扫描的消息数，超出时返回部分结果并标记 truncated
    default_limit: 1000      # 默认返回点数，超出时在网关端降采样
    timeout: "10s"

# 规则引擎配置
rule_engine:
  enabled: true
  rules_dir: "./rules"
  subject: "iot.data.>"
  
  # 规则文件热加载配置
  hot_reload:
    enabled: true                    # 启用/禁用规则文件热加载
    graceful_fallback: true          # 热加载失败时优雅降级
    retry_interval: "30s"            # 文件监控器启动失败后重试间隔
    max_retries: 3                   # 最大重试次数
    debounce_delay: "100ms"          # 文件变更防抖延迟

  # 聚合窗口状态持久化：保存到 JetStream KV（IOT_AGG_STATE），网关重启后恢复，长时间窗口的统计不被打断
