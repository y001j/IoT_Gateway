# IoT Gateway 配置 - 禁用热加载版本
# 此配置文件用于演示禁用热加载功能

# 网关核心配置
gateway:
  name: "IoT Gateway - No Hot Reload"
  version: "1.0.0"
  log_level: "info"
  http_port: 8080
  https_port: 8443
  nats_url: "embedded"
  plugins_dir: "./plugins"

  # 采集数据管道参数
  pipeline:
    batch_size: 100          # 每批数据点数量
    flush_interval: "50ms"   # 批次未满时的最长等待时间
    channel_size: 10000      # 适配器到管道的缓冲通道大小
    sink_queue_size: 256     # 每个连接器的批次队列长度（满了会丢弃该连接器的批次并计数）
  enable_metrics: true
  enable_profiling: true
  
  # 热加载配置 - 禁用
  hot_reload:
    enabled: false                   # 禁用配置文件热加载
    graceful_fallback: true          # 热加载失败时优雅降级
    retry_interval: "30s"            # 监控器启动失败后重试间隔
    max_retries: 3                   # 最大重试次数

# 规则引擎配置
rule_engine:
  enabled: true
  rules_dir: "./rules"
  subject: "iot.data.>"
  
  # 规则文件热加载配置 - 禁用
  hot_reload:
    enabled: false                   # 禁用规则文件热加载
    graceful_fallback: true          # 热加载失败时优雅降级
    retry_interval: "30s"            # 文件监控器启动失败后重试间隔
    max_retries: 3                   # 最大重试次数
    debounce_delay: "100ms"          # 文件变更防抖延迟

# 南向适配器配置
southbound:
  adapters:
    # 注意：以前这里使用的 params.sensors 旧格式 mock 适配器并不识别，会导致初始化失败
    - name: "mock_sensor"
      type: "mock"
      enabled: true
      config:
        name: "mock_sensor"
        type: "mock"
        interval: "5s"
        data_points:
          - device_id: "mock_sensor_01"
            key: "temperature"
            min_value: 15.0
            max_value: 35.0
            unit: "celsius"
          - device_id: "mock_sensor_01"
            key: "humidity"
            min_value: 30.0
            max_value: 80.0
            unit: "percent"

# 北向连接器配置
northbound:
  sinks:
    - name: "console_output"
      type: "console"
      enabled: true
      params:
        format: "json"
        timestamp: true