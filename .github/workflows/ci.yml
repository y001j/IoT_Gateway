name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  release:
    types: [ published ]

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '22' # vite 7 需要 Node 20.19+

jobs:
  # Go后端测试
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Run go vet
      run: go vet ./...

    - name: Run go fmt check
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "The following files need formatting:"
          gofmt -s -l .
          exit 1
        fi

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out ./...
      env:
        NATS_URL: nats://localhost:4222
        REDIS_URL: redis://localhost:6379

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.out
        flags: backend
        name: backend-coverage

  # 前端测试
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web/frontend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: web/frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run lint
      run: npm run lint

    - name: Run type check
      run: npx tsc --noEmit --skipLibCheck

    - name: Run tests
      run: npm test -- --coverage --watchAll=false

    - name: Build frontend
      run: npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: web/frontend/dist/

  # 构建和发布Docker镜像
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.event_name == 'push' || github.event_name == 'release'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      if: github.event_name == 'release'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          iot-gateway
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name == 'release' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # 32 位 ARM（ARMv7）测试：通过 QEMU 用户态模拟运行全部单元测试。
  # 64 位原子操作在 ARMv7 上要求 8 字节对齐，未对齐时运行到那里才会 panic，只能实际运行才能发现
  armv7-test:
    name: ARMv7 Tests (QEMU)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm

    - name: Run tests on linux/arm (GOARM=7)
      env:
        GOOS: linux
        GOARCH: arm
        GOARM: '7'
        CGO_ENABLED: '0'
      run: go test -count=1 -timeout 20m ./...

  # 安全扫描
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Run gosec Security Scanner
      # 官方 action 的 Docker 镜像内置的 Go 版本低于 go.mod 要求，加载包失败且不输出原因；
      # 改为用 setup-go 的 Go 安装同一版本 gosec。发现问题时同样失败，并在日志中列出问题。
      run: |
        go install github.com/securego/gosec/v2/cmd/gosec@v2.22.4
        gosec -fmt sarif -out gosec.sarif -stdout -verbose text ./...

    - name: Upload SARIF file
      if: always() && hashFiles('gosec.sarif') != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: gosec.sarif

  # 性能基准测试
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Run benchmarks
      run: |
        go test -bench=. -benchmem -count=3 ./internal/rules/... > benchmark.txt
        go test -bench=. -benchmem -count=3 ./internal/plugin/... >> benchmark.txt

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: benchmark.txt

  # 发布GitHub Release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, docker-build]
    if: github.event_name == 'release'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Download frontend build
      uses: actions/download-artifact@v4
      with:
        name: frontend-build
        path: web/frontend/dist/

    - name: Build binaries
      run: |
        GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o iot-gateway-linux-amd64 cmd/gateway/main.go
        GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o iot-gateway-linux-arm64 cmd/gateway/main.go
        GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o iot-gateway-windows-amd64.exe cmd/gateway/main.go
        GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o iot-gateway-darwin-amd64 cmd/gateway/main.go
        GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o iot-gateway-darwin-arm64 cmd/gateway/main.go

    - name: Create checksums
      run: |
        sha256sum iot-gateway-* > checksums.txt

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          iot-gateway-*
          checksums.txt
        body: |
          ## 🚀 IoT Gateway Release ${{ github.ref_name }}
          
          ### 📦 Assets
          - `iot-gateway-linux-amd64`: Linux x64
          - `iot-gateway-linux-arm64`: Linux ARM64
          - `iot-gateway-windows-amd64.exe`: Windows x64
          - `iot-gateway-darwin-amd64`: macOS Intel
          - `iot-gateway-darwin-arm64`: macOS Apple Silicon
          
          ### 🔒 Verification
          ```bash
          sha256sum -c checksums.txt
          ```
          
          See [CHANGELOG.md](CHANGELOG.md) for details.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}